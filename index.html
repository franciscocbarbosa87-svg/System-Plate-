<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Plate - Firebase Realtime</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<style>

:root{
    --red:#ff1e1e;
    --red-dark:#a40000;
    --black:#050505;
    --glass:rgba(255,255,255,0.04);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}

body{
    background:#050505;
    background-image:
    radial-gradient(circle at top left, rgba(255,0,0,0.18), transparent 35%),
    radial-gradient(circle at bottom right, rgba(255,0,0,0.12), transparent 35%);
    color:#fff;
    min-height:100vh;
}

/* HEADER */

header{
    text-align:center;
    padding:38px 20px 22px;
}

.header-main{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
}

.logo-icon{
    width:58px;
    height:58px;
    border-radius:16px;
    background:linear-gradient(135deg,#ff0000,#520000);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
    font-family:'Orbitron',sans-serif;
    color:#fff;
    box-shadow:
    0 0 18px rgba(255,0,0,0.6),
    0 0 35px rgba(255,0,0,0.25);
}

header h1{
    font-size:32px;
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    letter-spacing:2px;
    white-space:nowrap;
    background:linear-gradient(to right,#ffffff,#ff0000,#ff4d4d);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 25px rgba(255,0,0,0.35);
}

.sub-container{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.linha-neon{
    width:340px;
    max-width:92%;
    height:2px;
    background:linear-gradient(to right,transparent,#ff0000,transparent);
    box-shadow:0 0 14px #ff0000;
}

.sub-titulo{
    font-size:0.75rem;
    letter-spacing:2px;
    color:#d7d7d7;
}

/* MENU */

nav{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:25px 0;
}

nav button{
    padding:12px 22px;
    border:none;
    border-radius:30px;
    background:rgba(255,255,255,0.05);
    color:#fff;
    cursor:pointer;
    font-weight:700;
    border:1px solid rgba(255,255,255,0.06);
    transition:0.3s;
}

nav button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 18px rgba(255,0,0,0.25);
}

.active-nav{
    background:linear-gradient(135deg,#ff0000,#520000);
    color:#fff;
    box-shadow:0 0 18px rgba(255,0,0,0.45);
}

.admin-btn{
    color:#ff5b5b !important;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:0 18px 35px;
}

.card{
    display:none;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,0,0,0.14);
    border-radius:26px;
    padding:28px;
    backdrop-filter:blur(20px);
    box-shadow:
    0 0 25px rgba(255,0,0,0.08),
    inset 0 0 18px rgba(255,0,0,0.04);
}

.card.active{
    display:block;
}

/* INPUTS */

.input-group{
    margin-bottom:16px;
}

.row-fields{
    display:flex;
    gap:12px;
}

.row-fields .input-group{
    flex:1;
}

label{
    display:block;
    margin-bottom:7px;
    color:#ff4d4d;
    font-size:0.85rem;
    font-weight:700;
}

input{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid rgba(255,0,0,0.12);
    background:rgba(0,0,0,0.55);
    color:#fff;
    outline:none;
    transition:0.3s;
}

input:focus{
    border-color:#ff0000;
    box-shadow:0 0 15px rgba(255,0,0,0.25);
}

/* BOTÕES */

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-weight:800;
    margin-top:10px;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:linear-gradient(135deg,#ff0000,#520000);
    color:#fff;
    box-shadow:0 0 18px rgba(255,0,0,0.3);
}

.btn-whatsapp{
    background:#25D366;
    color:#fff;
}

.btn-voltar-area{
    display:flex;
    justify-content:center;
    margin-top:18px;
}

.btn-voltar{
    padding:9px 22px;
    border:none;
    border-radius:30px;
    background:rgba(255,0,0,0.10);
    border:1px solid rgba(255,0,0,0.35);
    color:#ff4d4d;
    cursor:pointer;
    font-size:0.75rem;
    font-weight:700;
}

/* STATUS */

.status{
    margin-top:15px;
    padding:12px;
    border-radius:12px;
    font-size:0.9rem;
}

.error{
    background:rgba(255,0,0,0.10);
    color:#ff5c5c;
}

.success{
    background:rgba(37,211,102,0.10);
    color:#25D366;
}

.warning{
    background:rgba(255,193,7,0.10);
    color:#ffc107;
}

/* DASHBOARD */

.dashboard-card{
    background:rgba(255,255,255,0.03);
    border-radius:18px;
    padding:20px;
    margin-top:20px;
    border:1px solid rgba(255,0,0,0.10);
}

.dashboard-number{
    font-size:2rem;
    font-weight:800;
    color:#ff2e2e;
    text-align:center;
}

.admin-title{
    color:#ff4d4d;
    margin-bottom:20px;
}

/* BLOCOS */

.blocos-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:20px;
}

.bloco-card{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,0,0,0.12);
    border-radius:18px;
    height:85px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.3s;
}

.bloco-card:hover{
    transform:translateY(-4px);
    border-color:#ff0000;
    box-shadow:0 0 20px rgba(255,0,0,0.25);
}

.bloco-numero{
    font-size:1.7rem;
    font-weight:800;
    color:#ff2e2e;
}

.bloco-detalhes{
    margin-top:15px;
    display:none;
    background:rgba(255,255,255,0.03);
    border-radius:16px;
    padding:15px;
    border:1px solid rgba(255,0,0,0.10);
}

.veiculo-item{
    padding:14px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    line-height:1.7;
}

.veiculo-item:last-child{
    border:none;
}

/* RESULTADO */

.resultado-box{
    margin-top:20px;
    border-radius:15px;
    overflow:hidden;
    border:1px solid rgba(255,0,0,0.12);
}

.info-item{
    padding:14px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,0.06);
}

.info-item:last-child{
    border:none;
}

/* ADMIN */

.admin-actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.btn-edit{
    background:#ff0000;
    color:#fff;
}

.btn-delete{
    background:#520000;
    color:#fff;
}

/* FOOTER */

footer{
    text-align:center;
    padding:25px;
    color:#8d8d8d;
    font-size:0.72rem;
}

/* RESPONSIVO */

@media(max-width:600px){

.blocos-grid{
    grid-template-columns:repeat(4,1fr);
}

.bloco-card{
    height:75px;
}

.bloco-numero{
    font-size:1.3rem;
}

.row-fields{
    flex-direction:row;
}

header h1{
    font-size:25px;
}

}

</style>
</head>

<body>

<header>

<div class="header-main">
<div class="logo-icon">S</div>
<h1>System Plate</h1>
</div>

<div class="sub-container">

<div class="linha-neon"></div>

<div class="sub-titulo">
🛡️ SISTEMA EM NUVEM PARA USO INTERNO DO CONDOMÍNIO
</div>

<div class="linha-neon"></div>

</div>

</header>

<nav>

<button class="active-nav" onclick="abrirPagina('pesquisa', this)">
🔍 Buscar
</button>

<button onclick="abrirPagina('cadastro', this)">
➕ Cadastrar
</button>

<button class="admin-btn" onclick="abrirPagina('adminLogin', this)">
🛡️ Admin
</button>

</nav>

<main class="container">

<section id="pesquisa" class="card active">

<div class="input-group">

<label>PLACA DO VEÍCULO</label>

<input
type="text"
id="placaPesquisa"
placeholder="DIGITE A PLACA..."
style="text-transform:uppercase;"
>

</div>

<button class="btn btn-primary" onclick="pesquisarVeiculo()">
CONSULTAR AGORA
</button>

<div id="resultadoPesquisa"></div>

<div id="areaWhatsApp"></div>

<div class="btn-voltar-area">
<button class="btn-voltar" onclick="novaPesquisa()">
🔄 NOVA PESQUISA
</button>
</div>

</section>

<section id="cadastro" class="card">

<h2 style="margin-bottom:25px;color:#ff4d4d;">
NOVO REGISTRO
</h2>

<div class="input-group">
<label>Placa</label>
<input type="text" id="placa" style="text-transform:uppercase;">
</div>

<div class="input-group">
<label>Modelo / Cor</label>
<input type="text" id="modelo">
</div>

<div class="row-fields">

<div class="input-group">
<label>Bloco</label>
<input type="text" id="bloco" placeholder="01">
</div>

<div class="input-group">
<label>Apartamento</label>
<input type="text" id="apartamento" placeholder="101">
</div>

</div>

<button class="btn btn-primary" onclick="cadastrarVeiculo()">
SALVAR NO FIREBASE
</button>

<div id="statusCadastro"></div>

<div class="btn-voltar-area">
<button class="btn-voltar" onclick="limparCadastro()">
🔄 NOVO REGISTRO
</button>
</div>

</section>

<section id="adminLogin" class="card">

<h2 class="admin-title">
🔐 PAINEL ADMINISTRATIVO
</h2>

<div class="input-group">

<label>Senha</label>

<input type="password" id="senhaAdmin">

</div>

<button class="btn btn-primary" onclick="acessarDashboard()">
ACESSAR
</button>

<div id="statusAdmin"></div>

<div class="btn-voltar-area">
<button class="btn-voltar" onclick="voltarInicio()">
⬅ VOLTAR
</button>
</div>

</section>

<section id="dashboard" class="card">

<h2 class="admin-title">
📊 DASHBOARD ADMIN
</h2>

<div class="dashboard-card">

<h3 style="text-align:center;">
🚘 VEÍCULOS CADASTRADOS
</h3>

<div class="dashboard-number" id="totalVeiculos">
0
</div>

</div>

<div class="dashboard-card">

<h3 style="margin-bottom:15px;text-align:center;">
🏢 BLOCOS CADASTRADOS
</h3>

<div id="listaBlocos" class="blocos-grid"></div>

<div id="blocoDetalhes" class="bloco-detalhes"></div>

</div>

<div class="dashboard-card">

<h3 style="margin-bottom:20px;text-align:center;">
🚘 GERENCIADOR DE VEÍCULOS
</h3>

<div class="input-group">

<label>Pesquisar placa</label>

<input
type="text"
id="buscarAdmin"
placeholder="DIGITE A PLACA..."
style="text-transform:uppercase;"
>

</div>

<button
class="btn btn-primary"
onclick="buscarVeiculoAdmin()"
>
CONSULTAR VEÍCULO
</button>

<div id="resultadoAdmin"></div>

</div>

<div class="btn-voltar-area">
<button class="btn-voltar" onclick="voltarInicio()">
⬅ VOLTAR
</button>
</div>

</section>

</main>

<footer>
Francisco © 2026 | Gestão de Acesso v0.19
</footer>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAX1zG5x9ftv7oJRobNnrbPjBGwVSdYjQY",
authDomain: "system-plate-fc82a.firebaseapp.com",
databaseURL: "https://system-plate-fc82a-default-rtdb.firebaseio.com",
projectId: "system-plate-fc82a",
storageBucket: "system-plate-fc82a.firebasestorage.app",
messagingSenderId: "407661799997",
appId: "1:407661799997:web:5d1be7dc34764422db5854"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

const SENHA_ADMIN = "123456";

let dadosVeiculos = {};

function abrirPagina(id, btn){

document.querySelectorAll(".card")
.forEach(c => c.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

document.querySelectorAll("nav button")
.forEach(b => b.classList.remove("active-nav"));

if(btn){
btn.classList.add("active-nav");
}

}

function voltarInicio(){

document.querySelectorAll(".card")
.forEach(c => c.classList.remove("active"));

document.getElementById("pesquisa")
.classList.add("active");

}

function novaPesquisa(){

document.getElementById("placaPesquisa").value = "";

document.getElementById("resultadoPesquisa").innerHTML = "";

document.getElementById("areaWhatsApp").innerHTML = "";

}

function acessarDashboard(){

const senha =
document.getElementById("senhaAdmin").value;

if(senha === SENHA_ADMIN){

abrirPagina("dashboard");

carregarDashboard();

}else{

document.getElementById("statusAdmin")
.innerHTML = `
<div class="status error">
❌ Senha incorreta.
</div>
`;

}

}

function carregarDashboard(){

database.ref("veiculos")
.on("value", snapshot => {

dadosVeiculos = snapshot.val() || {};

const total =
Object.keys(dadosVeiculos).length;

document.getElementById("totalVeiculos")
.innerText = total;

carregarBlocos();

});

}

function carregarBlocos(){

let html = "";

for(let i=1; i<=12; i++){

let bloco =
i.toString().padStart(2,"0");

html += `

<div
class="bloco-card"
onclick="abrirBloco('${bloco}')"
>

<div class="bloco-numero">
${bloco}
</div>

</div>

`;

}

document.getElementById("listaBlocos")
.innerHTML = html;

}

function abrirBloco(bloco){

let html = `
<h3 style="margin-bottom:15px;color:#ff4d4d;">
🏢 BLOCO ${bloco}
</h3>
`;

let listaVeiculos = [];

Object.values(dadosVeiculos).forEach(v => {

if(v.bloco === bloco){

listaVeiculos.push(v);

}

});

listaVeiculos.sort((a,b) => {
return Number(a.apartamento) - Number(b.apartamento);
});

if(listaVeiculos.length > 0){

listaVeiculos.forEach(v => {

html += `

<div class="veiculo-item">

🚪 <b>APTO ${v.apartamento}</b><br>

🚘 Veículo: ${v.modelo}<br>

🆔 Placa: ${v.placa}

</div>

`;

});

}else{

html += `
<div class="status error">
Nenhum veículo cadastrado neste bloco.
</div>
`;

}

const detalhes =
document.getElementById("blocoDetalhes");

detalhes.style.display = "block";

detalhes.innerHTML = html;

}

function cadastrarVeiculo(){

const placa =
document.getElementById("placa")
.value.toUpperCase().trim();

const modelo =
document.getElementById("modelo")
.value.trim();

const bloco =
document.getElementById("bloco")
.value.trim();

const apartamento =
document.getElementById("apartamento")
.value.trim();

const status =
document.getElementById("statusCadastro");

if(!placa || !modelo || !bloco || !apartamento){

status.innerHTML = `
<div class="status error">
⚠️ Preencha todos os campos.
</div>
`;

return;

}

database.ref("veiculos/" + placa)
.once("value")

.then(snapshot => {

if(snapshot.exists()){

status.innerHTML = `
<div class="status warning">
⚠️ Esta placa já está cadastrada no sistema.
</div>
`;

return;

}

database.ref("veiculos/" + placa)
.set({
placa,
modelo,
bloco,
apartamento
})

.then(() => {

status.innerHTML = `
<div class="status success">
✅ Veículo cadastrado com sucesso.
</div>
`;

limparCadastro();

});

});

}

function pesquisarVeiculo(){

const busca =
document.getElementById("placaPesquisa")
.value.toUpperCase().trim();

if(!busca) return;

database.ref("veiculos/" + busca)
.once("value")

.then(snapshot => {

const v = snapshot.val();

if(v){

document.getElementById("resultadoPesquisa")
.innerHTML = `

<div class="resultado-box">

<div class="info-item">
<span>🚘 Veículo:</span>
<b>${v.modelo}</b>
</div>

<div class="info-item">
<span>🏢 Bloco:</span>
<b>${v.bloco}</b>
</div>

<div class="info-item">
<span>🚪 Apto:</span>
<b>${v.apartamento}</b>
</div>

</div>

`;

document.getElementById("areaWhatsApp")
.innerHTML = `

<button
class="btn btn-whatsapp"
onclick="enviarWhatsApp(
'${v.modelo}',
'${v.bloco}',
'${v.apartamento}',
'${v.placa}'
)">
📱 NOTIFICAR VIA WHATSAPP
</button>

`;

}else{

document.getElementById("resultadoPesquisa")
.innerHTML = `
<div class="status error">
❌ Placa não encontrada.
</div>
`;

document.getElementById("areaWhatsApp")
.innerHTML = "";

}

});

}

function enviarWhatsApp(mod,blo,apt,pla){

const msg =
`*🚨 AVISO DE SEGURANÇA*%0A%0A` +
`Veículo sem o crachá de identificação.%0A%0A` +
`🚘 *Veículo:* ${mod}%0A` +
`🏢 *Local:* Bloco ${blo} / Apto ${apt}%0A` +
`🆔 *Placa:* ${pla}`;

window.open(
`https://api.whatsapp.com/send?text=${msg}`,
"_blank"
);

}

function limparCadastro(){

document.getElementById("placa").value = "";
document.getElementById("modelo").value = "";
document.getElementById("bloco").value = "";
document.getElementById("apartamento").value = "";

}

function buscarVeiculoAdmin(){

const placa =
document.getElementById("buscarAdmin")
.value.toUpperCase().trim();

if(!placa) return;

database.ref("veiculos/" + placa)
.once("value")

.then(snapshot => {

if(snapshot.exists()){

const v = snapshot.val();

document.getElementById("resultadoAdmin")
.innerHTML = `

<div style="margin-top:20px;">

<label>Modelo / Cor</label>

<input
type="text"
id="editModelo"
value="${v.modelo}"
>

<div class="row-fields">

<div class="input-group">

<label>Bloco</label>

<input
type="text"
id="editBloco"
value="${v.bloco}"
>

</div>

<div class="input-group">

<label>Apartamento</label>

<input
type="text"
id="editApartamento"
value="${v.apartamento}"
>

</div>

</div>

<div class="admin-actions">

<button
class="btn btn-edit"
onclick="salvarAlteracoes('${v.placa}')"
>
💾 SALVAR
</button>

<button
class="btn btn-delete"
onclick="excluirVeiculo('${v.placa}')"
>
🗑 EXCLUIR
</button>

</div>

</div>

`;

}else{

document.getElementById("resultadoAdmin")
.innerHTML = `
<div class="status error">
❌ Veículo não encontrado.
</div>
`;

}

});

}

function salvarAlteracoes(placa){

database.ref("/" + placa)
.update({

modelo:
document.getElementById("editModelo").value,

bloco:
document.getElementById("editBloco").value,

apartamento:
document.getElementById("editApartamento").value

})

.then(() => {

document.getElementById("resultadoAdmin")
.innerHTML += `
<div class="status success">
✅ Alterações salvas com sucesso.
</div>
`;

});

}

function excluirVeiculo(placa){

const confirmar =
confirm("Deseja excluir este veículo?");

if(!confirmar) return;

database.ref("veiculos/" + placa)
.remove()

.then(() => {

document.getElementById("resultadoAdmin")
.innerHTML = `
<div class="status success">
🗑 Veículo excluído com sucesso.
</div>
`;

});

}

</script>

</body>
</html>
