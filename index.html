<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Plate - Online</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">

<style>
:root {
    --primary:#00d2ff;
    --secondary:#3a7bd5;
    --accent:#25D366;
    --bg-dark:#0a0f1a;
    --card-bg:rgba(255,255,255,0.05);
    --glass-border:rgba(255,255,255,0.1);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;}
body{background:var(--bg-dark);color:#fff;text-align:center;padding:20px;}

.container{max-width:420px;margin:auto;}

.card{
    background:var(--card-bg);
    padding:25px;
    border-radius:20px;
    border:1px solid var(--glass-border);
    margin-top:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:10px;
    border:none;
    background:#111;
    color:#fff;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.btn-primary{background:linear-gradient(135deg,var(--primary),var(--secondary));}
.btn-whatsapp{background:var(--accent);margin-top:10px;}

.status{margin-top:10px;padding:10px;border-radius:10px;}
.error{background:#ff000020;color:#ff4d4d;}
.success{background:#25D36620;color:#25D366;}
</style>
</head>

<body>

<div class="container">

<h2>🔐 System Plate (Online)</h2>

<div class="card">
<h3>🔍 Buscar</h3>
<input id="placaPesquisa" placeholder="PLACA">
<button class="btn-primary" onclick="pesquisarVeiculo()">CONSULTAR</button>
<div id="resultadoPesquisa"></div>
<div id="areaWhatsApp"></div>
</div>

<div class="card">
<h3>➕ Cadastrar</h3>
<input id="placa" placeholder="PLACA">
<input id="modelo" placeholder="MODELO">
<input id="bloco" placeholder="BLOCO">
<input id="apartamento" placeholder="APTO">
<button class="btn-primary" onclick="cadastrarVeiculo()">SALVAR</button>
<div id="statusCadastro"></div>
</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// 🔴 COLOQUE SUA CONFIG AQUI
const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "SEU_APP.firebaseapp.com",
  projectId: "SEU_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let veiculoAtual = null;

// VALIDAR PLACA
function validarPlaca(p){
    return /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/.test(p);
}

// CADASTRAR
async function cadastrarVeiculo(){
    const placa = document.getElementById("placa").value.toUpperCase().trim();
    const modelo = document.getElementById("modelo").value.trim();
    const bloco = document.getElementById("bloco").value.trim();
    const apto = document.getElementById("apartamento").value.trim();
    const status = document.getElementById("statusCadastro");

    if(!placa||!modelo||!bloco||!apto){
        status.innerHTML=`<div class="status error">Preencha tudo</div>`;
        return;
    }

    if(!validarPlaca(placa)){
        status.innerHTML=`<div class="status error">Placa inválida</div>`;
        return;
    }

    const existe = await db.collection("veiculos").where("placa","==",placa).get();

    if(!existe.empty){
        status.innerHTML=`<div class="status error">Placa já cadastrada</div>`;
        return;
    }

    await db.collection("veiculos").add({
        placa,modelo,bloco,apartamento:apto
    });

    status.innerHTML=`<div class="status success">Salvo online</div>`;

    ["placa","modelo","bloco","apartamento"].forEach(id=>document.getElementById(id).value="");
}

// PESQUISAR
async function pesquisarVeiculo(){
    const busca = document.getElementById("placaPesquisa").value.toUpperCase().trim();
    const res = document.getElementById("resultadoPesquisa");
    const zap = document.getElementById("areaWhatsApp");

    res.innerHTML="Buscando...";

    const query = await db.collection("veiculos").where("placa","==",busca).get();

    if(!query.empty){
        const v = query.docs[0].data();
        veiculoAtual=v;

        res.innerHTML=`
        <div>
        🚘 ${v.modelo}<br>
        🏢 Bloco: ${v.bloco}<br>
        🚪 Apto: ${v.apartamento}
        </div>`;

        zap.innerHTML=`<button class="btn-whatsapp" onclick="enviarWhatsApp()">WhatsApp</button>`;
    }else{
        veiculoAtual=null;
        res.innerHTML=`<div class="status error">Não encontrado</div>`;
        zap.innerHTML="";
    }
}

// WHATSAPP
function enviarWhatsApp(){
    if(!veiculoAtual)return;

    const numero="5511999999999";

    const msg=`VEICULO SEM CRACHA%0A`+
              `Veiculo:${veiculoAtual.modelo}%0A`+
              `Bloco:${veiculoAtual.bloco}%0A`+
              `Apto:${veiculoAtual.apartamento}%0A`+
              `Placa:${veiculoAtual.placa}`;

    window.open(`https://api.whatsapp.com/send?phone=${numero}&text=${msg}`);
}
</script>

</body>
</html>
