<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema de Portaria</title>
    <style>
        /* Estilos base para garantir o funcionamento visual */
        body { font-family: sans-serif; margin: 0; padding: 10px; background: #f4f4f4; }
        .card { display: none; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .active-nav { background: #007bff; color: white; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .error { background: #ffcccc; color: #cc0000; }
        .success { background: #d4edda; color: #155724; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-whatsapp { background: #25d366; color: white; font-weight: bold; }
        input { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
        nav { margin-bottom: 20px; display: flex; gap: 10px; }
        nav button { flex: 1; padding: 10px; }
        #displayPlaca { font-weight: bold; color: #555; }
    </style>
</head>
<body>

<nav>
    <button id="btnNavBusca" onclick="abrirPagina('pesquisa', this)" class="active-nav">🔍 Buscar</button>
    <button id="btnNavCad" onclick="abrirPagina('cadastro', this)">➕ Cadastrar</button>
</nav>

<div id="pesquisa" class="card" style="display: block;">
    <h2 id="displayPlaca">SYS-2026</h2>
    <input type="text" id="placaPesquisa" placeholder="Digite a placa (Ex: ABC1D23)">
    <button class="btn" onclick="pesquisarVeiculo()" style="background: #333; color: white;">PESQUISAR</button>
    
    <div id="resultadoPesquisa"></div>
    <div id="areaWhatsApp"></div>
    <div id="areaVoltar"></div>
</div>

<div id="cadastro" class="card">
    <h2>Cadastrar Veículo</h2>
    <input type="text" id="placa" placeholder="Placa">
    <input type="text" id="modelo" placeholder="Modelo/Cor">
    <input type="text" id="bloco" placeholder="Bloco">
    <input type="text" id="apartamento" placeholder="Apartamento">
    <button class="btn" onclick="cadastrarVeiculo()" style="background: #28a745; color: white;">SALVAR REGISTRO</button>
    <div id="statusCadastro"></div>
</div>

<script>
    // Inicialização do Banco de Dados Local
    let veiculos = JSON.parse(localStorage.getItem("veiculos")) || [
        { placa:"ABC1D23", modelo:"Corsa Preto", bloco:"1", apartamento:"101" }
    ];

    let veiculoAtual = null;

    function abrirPagina(id, btn){
        document.querySelectorAll(".card").forEach(c => c.style.display = "none");
        document.getElementById(id).style.display = "block";
        document.querySelectorAll("nav button").forEach(b => b.classList.remove("active-nav"));
        btn.classList.add("active-nav");
        
        if(id === 'cadastro') {
            voltarAoInicio();
            document.getElementById("statusCadastro").innerHTML = "";
        }
    }

    function cadastrarVeiculo(){
        const placa = document.getElementById("placa").value.toUpperCase().trim();
        const modelo = document.getElementById("modelo").value.trim();
        const bloco = document.getElementById("bloco").value.trim();
        const apto = document.getElementById("apartamento").value.trim();
        const status = document.getElementById("statusCadastro");

        if(!placa || !modelo || !bloco || !apto){
            status.innerHTML = `<div class="status error">⚠️ Preencha todos os campos!</div>`;
            return;
        }

        const existe = veiculos.some(v => v.placa === placa);
        if(existe){
            status.innerHTML = `<div class="status error">❌ Placa ${placa} já cadastrada!</div>`;
            return;
        }

        veiculos.push({ placa, modelo, bloco, apartamento: apto });
        localStorage.setItem("veiculos", JSON.stringify(veiculos));
        
        status.innerHTML = `<div class="status success">✅ Registro salvo com sucesso!</div>`;
        
        setTimeout(() => {
            ["placa", "modelo", "bloco", "apartamento"].forEach(id => document.getElementById(id).value = "");
            abrirPagina('pesquisa', document.getElementById('btnNavBusca'));
        }, 1500);
    }

    function pesquisarVeiculo(){
        const busca = document.getElementById("placaPesquisa").value.toUpperCase().trim();
        const resDiv = document.getElementById("resultadoPesquisa");
        const zapDiv = document.getElementById("areaWhatsApp");
        const voltarDiv = document.getElementById("areaVoltar");
        const displayPlaca = document.getElementById("displayPlaca");

        if(!busca) {
            resDiv.innerHTML = `<div class="status error">Digite uma placa.</div>`;
            return;
        }

        const v = veiculos.find(item => item.placa === busca);

        if(v){
            veiculoAtual = v;
            displayPlaca.innerText = v.placa;
            resDiv.innerHTML = `
                <div style="margin-top:15px; border-left: 4px solid #007bff; padding-left: 10px;">
                    <div><span>🚘 Veículo:</span> <b>${v.modelo}</b></div>
                    <div><span>🏢 Bloco:</span> <b>${v.bloco}</b></div>
                    <div><span>🚪 Apto:</span> <b>${v.apartamento}</b></div>
                </div>
            `;
            zapDiv.innerHTML = `<button class="btn btn-whatsapp" onclick="enviarWhatsApp()">📱 ENVIAR NOTIFICAÇÃO</button>`;
            voltarDiv.innerHTML = `<button class="btn" onclick="voltarAoInicio()" style="background:#eee; color:#333;">↺ Nova Consulta</button>`;
        } else {
            veiculoAtual = null;
            displayPlaca.innerText = "S-404";
            resDiv.innerHTML = `<div class="status error">❌ Placa não encontrada.</div>`;
            zapDiv.innerHTML = "";
            voltarDiv.innerHTML = `<button class="btn" onclick="voltarAoInicio()" style="background:#eee; color:#333;">↺ Voltar</button>`;
        }
    }

    function voltarAoInicio() {
        document.getElementById("placaPesquisa").value = "";
        document.getElementById("resultadoPesquisa").innerHTML = "";
        document.getElementById("areaWhatsApp").innerHTML = "";
        document.getElementById("areaVoltar").innerHTML = "";
        document.getElementById("displayPlaca").innerText = "SYS-2026";
        veiculoAtual = null;
    }

    function enviarWhatsApp(){
        if(!veiculoAtual) return;

        if (!navigator.onLine) {
            alert("⚠️ Sem conexão com a internet!");
            return;
        }

        const msg = encodeURIComponent(
            `*AVISO DE SEGURANÇA*\n\n` +
            `O veículo foi identificado sem o crachá de identificação obrigatório.\n\n` +
            `🚘 *Veículo:* ${veiculoAtual.modelo}\n` +
            `🏢 *Bloco:* ${veiculoAtual.bloco}\n` +
            `🚪 *Apto:* ${veiculoAtual.apartamento}\n` +
            `🆔 *Placa:* ${veiculoAtual.placa}\n\n` +
            `_Por favor, regularize a situação._`
        );

        // No Android, o esquema 'api.whatsapp.com' ou 'wa.me' é o mais estável para WebViews
        const urlWeb = `https://api.whatsapp.com/send?text=${msg}`;
        
        // Tenta abrir em nova aba para não fechar o app
        window.open(urlWeb, '_blank');
    }

    document.getElementById("placaPesquisa").addEventListener("keypress", function(e) {
        if (e.key === "Enter") pesquisarVeiculo();
    });
</script>

</body>
</html>
