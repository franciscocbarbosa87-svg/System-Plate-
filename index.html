<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Plate V2</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<style>

:root{
    --primary:#00d2ff;
    --secondary:#3a7bd5;
    --accent:#25D366;
    --bg-dark:#0a0f1a;
    --card-bg:rgba(255,255,255,0.05);
    --glass-border:rgba(255,255,255,0.1);
    --red-neon:#ff0000;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}

body{
    background-color:var(--bg-dark);
    background-image:
    radial-gradient(at 0% 0%, rgba(58,123,213,0.15) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(0,210,255,0.10) 0px, transparent 50%);
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    padding:40px 20px 10px;
    text-align:center;
}

.header-main{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    margin-bottom:15px;
}

.logo-icon{
    width:60px;
    height:60px;
    border-radius:16px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:26px;
    font-family:'Orbitron',sans-serif;
    box-shadow:0 0 20px var(--red-neon);
    animation:pulse 2s infinite alternate;
}

@keyframes pulse{
    from{
        box-shadow:0 0 10px var(--red-neon);
    }
    to{
        box-shadow:0 0 30px var(--red-neon);
    }
}

header h1{
    font-family:'Orbitron',sans-serif;
    font-size:30px;
    background:linear-gradient(to right,#fff,var(--primary));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.sub{
    margin-top:10px;
    font-size:0.75rem;
    letter-spacing:1px;
    color:#fff;
}

nav{
    display:none;
    justify-content:center;
    gap:10px;
    margin:20px;
    flex-wrap:wrap;
}

nav.visible{
    display:flex;
}

nav button{
    padding:12px 22px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-weight:700;
    color:white;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
}

.active-nav{
    background:white;
    color:#000;
}

.container{
    width:100%;
    max-width:430px;
    margin:auto;
    padding:20px;
}

.card{
    display:none;
    background:var(--card-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(20px);
    border-radius:25px;
    padding:30px;
    animation:fade .4s ease;
}

.card.active{
    display:block;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    color:var(--primary);
    font-size:0.8rem;
    font-weight:700;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(0,0,0,0.4);
    color:white;
    outline:none;
    font-size:1rem;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:800;
    font-size:1rem;
    transition:.3s;
}

.btn-primary{
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:white;
}

.btn-whatsapp{
    background:var(--accent);
    color:white;
    margin-top:18px;
}

.btn-voltar{
    margin-top:15px;
    width:auto;
    padding:10px 18px;
    background:rgba(255,255,255,0.08);
    border:none;
    border-radius:10px;
    color:white;
    cursor:pointer;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    font-size:0.9rem;
}

.error{
    background:rgba(255,0,0,0.1);
    color:#ff4d4d;
}

.success{
    background:rgba(0,255,100,0.1);
    color:#25D366;
}

.warning{
    background:rgba(255,193,7,0.1);
    color:#ffc107;
}

.resultado-box{
    margin-top:20px;
    border-radius:15px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.1);
}

.info-item{
    padding:14px;
    display:flex;
    justify-content:space-between;
    background:rgba(255,255,255,0.03);
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.info-item:last-child{
    border-bottom:none;
}

.placa{
    width:170px;
    height:70px;
    background:white;
    margin:0 auto 30px;
    border-radius:8px;
    overflow:hidden;
    border:2px solid #222;
}

.placa-top{
    height:20px;
    background:#003399;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:800;
}

.placa-body{
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:black;
    font-size:24px;
    font-weight:900;
    letter-spacing:2px;
}

footer{
    text-align:center;
    padding:20px;
    color:#999;
    font-size:0.75rem;
}

</style>
</head>

<body>

<header>

<div class="header-main">

<div class="logo-icon">
S
</div>

<h1>System Plate</h1>

</div>

<div class="sub">
🛡️ SISTEMA EM NUVEM PARA USO INTERNO
</div>

</header>

<nav id="mainNav">

<button class="active-nav" onclick="abrirPagina('pesquisa',this)">
🔍 Buscar
</button>

<button onclick="abrirPagina('cadastro',this)">
➕ Cadastrar
</button>

<button onclick="location.reload()" style="color:#ff4d4d;">
Logout
</button>

</nav>

<main class="container">

<!-- LOGIN -->

<section id="login" class="card active">

<h2 style="margin-bottom:25px;color:var(--primary);">
LOGIN DO SISTEMA
</h2>

<div class="input-group">
<label>Usuário</label>
<input type="text" id="user" placeholder="Usuário">
</div>

<div class="input-group">
<label>Senha</label>
<input type="password" id="pass" placeholder="Senha">
</div>

<button class="btn btn-primary" onclick="realizarLogin()">
ACESSAR BANCO DE DADOS
</button>

<div id="loginStatus"></div>

</section>

<!-- PESQUISA -->

<section id="pesquisa" class="card">

<div class="placa">

<div class="placa-top">
BRASIL
</div>

<div class="placa-body">
SEARCH
</div>

</div>

<div class="input-group">

<label style="text-align:center;">
PLACA DO VEÍCULO
</label>

<input
type="text"
id="placaPesquisa"
placeholder="DIGITE A PLACA..."
style="text-transform:uppercase;text-align:center;"
>

</div>

<button class="btn btn-primary" onclick="pesquisarVeiculo()">
CONSULTAR AGORA
</button>

<div id="resultadoPesquisa"></div>

<div id="areaWhatsApp"></div>

<button class="btn-voltar" onclick="limparPesquisa()">
← Voltar
</button>

</section>

<!-- CADASTRO -->

<section id="cadastro" class="card">

<h2 style="margin-bottom:25px;color:var(--primary);">
NOVO REGISTRO
</h2>

<div class="input-group">
<label>Placa</label>
<input
type="text"
id="placa"
placeholder="Digite a placa"
style="text-transform:uppercase;"
>
</div>

<div class="input-group">
<label>Modelo / Cor</label>
<input
type="text"
id="modelo"
placeholder="Ex: Corolla Branco"
>
</div>

<div style="display:flex;gap:10px;">

<div class="input-group" style="flex:1;">
<label>Bloco</label>
<input type="text" id="bloco" placeholder="Nº">
</div>

<div class="input-group" style="flex:1;">
<label>Apto</label>
<input type="text" id="apartamento" placeholder="Nº">
</div>

</div>

<button class="btn btn-primary" onclick="cadastrarVeiculo()">
SALVAR NO FIREBASE
</button>

<div id="statusCadastro"></div>

<button class="btn-voltar" onclick="limparCadastro()">
← Voltar
</button>

</section>

</main>

<footer>
Francisco © 2026 | Gestão de Acesso V2
</footer>

<script>

// FIREBASE

const firebaseConfig = {

apiKey: "AIzaSyAX1zG5x9ftv7oJRobNnrbPjBGwVSdYjQY",

authDomain: "system-plate-fc82a.firebaseapp.com",

databaseURL: "https://system-plate-fc82a-default-rtdb.firebaseio.com",

projectId: "system-plate-fc82a",

storageBucket: "system-plate-fc82a.firebasestorage.app",

messagingSenderId: "407661799997",

appId: "1:407661799997:web:5d1be7dc34764422db5854"

};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();


// LOGIN

function realizarLogin(){

const u = document.getElementById("user").value;

const p = document.getElementById("pass").value;

const status = document.getElementById("loginStatus");

if(u === "admin" && p === "1234"){

document.getElementById("login").classList.remove("active");

document.getElementById("mainNav").classList.add("visible");

document.getElementById("pesquisa").classList.add("active");

}else{

status.innerHTML =
`<div class="status error">❌ Dados incorretos!</div>`;

}

}


// NAVEGAÇÃO

function abrirPagina(id,btn){

document.querySelectorAll(".card")
.forEach(c => c.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

document.querySelectorAll("nav button")
.forEach(b => b.classList.remove("active-nav"));

btn.classList.add("active-nav");

}


// CADASTRO

function cadastrarVeiculo(){

const placa =
document.getElementById("placa")
.value.toUpperCase().trim();

const modelo =
document.getElementById("modelo")
.value.trim();

const bloco =
document.getElementById("bloco")
.value.trim();

const apto =
document.getElementById("apartamento")
.value.trim();

const status =
document.getElementById("statusCadastro");

if(!placa || !modelo || !bloco || !apto){

status.innerHTML =
`<div class="status error">
⚠️ Preencha todos os campos!
</div>`;

return;

}

// VERIFICA PLACA

database.ref('veiculos/' + placa)
.once('value')
.then((snapshot)=>{

if(snapshot.exists()){

status.innerHTML =
`<div class="status warning">
⚠️ Esta placa já está cadastrada!
</div>`;

return;

}

// SALVA

database.ref('veiculos/' + placa).set({

placa:placa,

modelo:modelo,

bloco:bloco,

apartamento:apto

})
.then(()=>{

status.innerHTML =
`<div class="status success">
✅ Veículo cadastrado com sucesso!
</div>`;

limparCadastro();

})
.catch((e)=>{

status.innerHTML =
`<div class="status error">
Erro ao salvar: ${e.message}
</div>`;

});

});

}


// PESQUISA

function pesquisarVeiculo(){

const busca =
document.getElementById("placaPesquisa")
.value.toUpperCase().trim();

const resDiv =
document.getElementById("resultadoPesquisa");

const zapDiv =
document.getElementById("areaWhatsApp");

if(!busca) return;

database.ref('veiculos/' + busca)
.once('value')
.then((snapshot)=>{

const v = snapshot.val();

if(v){

resDiv.innerHTML = `

<div class="resultado-box">

<div class="info-item">
<span>🚘 Veículo:</span>
<b>${v.modelo}</b>
</div>

<div class="info-item">
<span>🏢 Bloco:</span>
<b>${v.bloco}</b>
</div>

<div class="info-item">
<span>🚪 Apto:</span>
<b>${v.apartamento}</b>
</div>

</div>

`;

zapDiv.innerHTML = `

<button
class="btn btn-whatsapp"
onclick="enviarWhatsApp(
'${v.modelo}',
'${v.bloco}',
'${v.apartamento}',
'${v.placa}'
)">
📱 NOTIFICAR VIA WHATSAPP
</button>

`;

}else{

resDiv.innerHTML =
`<div class="status error">
❌ Placa não encontrada na nuvem.
</div>`;

zapDiv.innerHTML = "";

}

});

}


// WHATSAPP

function enviarWhatsApp(mod,blo,apt,pla){

const numero = "55 11 977439379";

const msg =

`*AVISO DE SEGURANÇA*%0A%0A` +

`Identificamos o veículo abaixo sem o crachá de identificação no condomínio:%0A%0A` +

`🚘 *Veículo:* ${mod}%0A` +

`🏢 *Local:* Bloco ${blo} / Apto ${apt}%0A` +

`🆔 *Placa:* ${pla}%0A%0A` +



window.open(

`https://api.whatsapp.com/send?phone=${numero}&text=${msg}`,

'_blank'

);

}


// LIMPAR PESQUISA

function limparPesquisa(){

document.getElementById("placaPesquisa").value = "";

document.getElementById("resultadoPesquisa").innerHTML = "";

document.getElementById("areaWhatsApp").innerHTML = "";

}


// LIMPAR CADASTRO

function limparCadastro(){

document.getElementById("placa").value = "";

document.getElementById("modelo").value = "";

document.getElementById("bloco").value = "";

document.getElementById("apartamento").value = "";

}

</script>

</body>
</html>
