<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto com Firebase</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    input, button { display: block; width: 100%; padding: 10px; margin-top: 10px; }
    button { background-color: #0288d1; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #01579b; }
    ul { list-style-type: none; padding: 0; }
    li { background: #f4f4f4; margin: 5px 0; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>Firebase Web App</h1>

  <!-- Seção de Autenticação -->
  <div class="card">
    <h2>Autenticação</h2>
    <input type="email" id="email" placeholder="Seu e-mail">
    <input type="password" id="senha" placeholder="Sua senha">
    <button id="btn-cadastrar">Cadastrar Usuário</button>
    <button id="btn-login">Fazer Login</button>
    <p id="auth-status">Status: Desconectado</p>
  </div>

  <!-- Seção do Banco de Dados (Firestore) -->
  <div class="card">
    <h2>Banco de Dados (Firestore)</h2>
    <input type="text" id="dados-input" placeholder="Digite uma informação">
    <button id="btn-salvar">Salvar no Firestore</button>
    
    <h3>Itens Salvos:</h3>
    <ul id="lista-itens"></ul>
  </div>

  <!-- Firebase Script Import (ES Modules) -->
  <script type="module">
    // 1. Importações dos módulos do Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 2. Sua configuração do Firebase (Substitua pelas credenciais do seu console)
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      projectId: "SEU_PROJETO_ID",
      storageBucket: "SEU_PROJETO.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    // 3. Inicializando o Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- LÓGICA DE AUTENTICAÇÃO ---
    const emailInput = document.getElementById('email');
    const senhaInput = document.getElementById('senha');
    const statusTxt = document.getElementById('auth-status');

    document.getElementById('btn-cadastrar').addEventListener('click', async () => {
      try {
        await createUserWithEmailAndPassword(auth, emailInput.value, senhaInput.value);
        alert('Usuário cadastrado com sucesso!');
      } catch (error) {
        alert('Erro no cadastro: ' + error.message);
      }
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, senhaInput.value);
        alert('Login efetuado com sucesso!');
      } catch (error) {
        alert('Erro no login: ' + error.message);
      }
    });

    // Monitor do Estado de Autenticação
    onAuthStateChanged(auth, (user) => {
      if (user) {
        statusTxt.innerText = `Status: Logado como ${user.email}`;
      } else {
        statusTxt.innerText = 'Status: Desconectado';
      }
    });

    // --- LÓGICA DO FIRESTORE ---
    const dadosInput = document.getElementById('dados-input');
    const listaItens = document.getElementById('lista-itens');

    // Salvar Dados
    document.getElementById('btn-salvar').addEventListener('click', async () => {
      if (!dadosInput.value) return;
      try {
        await addDoc(collection(db, "mensagens"), {
          texto: dadosInput.value,
          data: new Date()
        });
        dadosInput.value = '';
      } catch (error) {
        alert('Erro ao salvar no banco: ' + error.message);
      }
    });

    // Ler Dados em Tempo Real
    onSnapshot(collection(db, "mensagens"), (snapshot) => {
      listaItens.innerHTML = '';
      snapshot.forEach((doc) => {
        const li = document.createElement('li');
        li.textContent = doc.data().texto;
        listaItens.appendChild(li);
      });
    });
  </script>
</body>
</html>
